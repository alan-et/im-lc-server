plugins {
    id "org.springframework.boot" version "2.7.18" // 升级至 2.7.x 以支持 JDK 17
    id "java"
    id "maven-publish"
    id "io.spring.dependency-management" version "1.0.15.RELEASE"
}

project.ext {
    SpringBootVer = "2.7.18"
    DubboVersion = "2.7.23"
    RedisVersion = "3.9.0"
    NettyVersion = "4.1.94.Final" // 提升 Netty 版本以解决 JDK 17 反射问题
    FastjsonVersion = "1.2.83"    // 修复安全漏洞
    ZookeeperVersion = "3.9.1"   // 提升 Zookeeper 客户端版本
}

sourceCompatibility = 11
targetCompatibility = 11

group 'com.alanpoi.im'
version '0.0.1-SNAPSHOT'

repositories {
    mavenLocal()
    maven {
        url "http://43.199.160.152:8081/repository/maven-public/"
        allowInsecureProtocol = true
    }
    maven { url "https://maven.aliyun.com/nexus/content/groups/public/" }
    mavenCentral()
}

dependencies {
    // Dubbo & Spring Boot 适配
    implementation("org.apache.dubbo:dubbo-spring-boot-starter:${DubboVersion}")
    implementation("org.apache.dubbo:dubbo:${DubboVersion}")
//    implementation("com.ctrip.framework.apollo:apollo-client:1.9.1") // 提升 Apollo 兼容性

    // Spring Boot Starters
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-amqp"
    implementation "org.springframework.boot:spring-boot-starter-data-redis"

    implementation("io.micrometer:micrometer-registry-prometheus:1.9.17")
    implementation("org.apache.commons:commons-lang3:3.12.0")
    implementation("io.netty:netty-all:${NettyVersion}")
    implementation("com.alibaba:fastjson:${FastjsonVersion}")
    implementation("com.google.protobuf:protobuf-java:3.19.6")
    implementation("com.googlecode.protobuf-java-format:protobuf-java-format:1.4")

    implementation("org.asynchttpclient:async-http-client:2.12.3") {
        exclude(group: 'io.netty')
    }
    implementation("redis.clients:jedis:${RedisVersion}")

    // Zookeeper & Curator
    implementation("org.apache.zookeeper:zookeeper:${ZookeeperVersion}") {
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        exclude group: 'log4j', module: 'log4j'
    }
    implementation("org.apache.curator:curator-recipes:4.2.0") {
        exclude(group: 'org.apache.zookeeper')
    }
    implementation("com.github.sgroschupf:zkclient:0.1") {
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    }

    implementation("org.apache.httpcomponents:httpclient:4.5.14")
    implementation("org.aspectj:aspectjrt:1.9.7")
    implementation("org.aspectj:aspectjweaver:1.9.7")

    // 业务依赖
    implementation group: 'com.alanpoi.im', name: 'im-common-lib', version: '1.0.0-SNAPSHOT'
    implementation group: 'com.alanpoi.im', name: 'im-message-servie', version: '0.0.1-SNAPSHOT'

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation 'junit:junit:4.13.2'
}


task copyTool(type: Copy) {
    delete 'build/tmp_tool/client/src/com/alanpoi/im/lcs/transtools'
    from 'src/main/java/com/alanpoi/im/lcs/transtools'
    into 'build/tmp_tool/client/src/com/alanpoi/transtools'
}

task compileTool(type: JavaCompile, dependsOn: copyTool) {
    delete 'build/tmp_tool/client/classes/*'
    source 'build/tmp_tool/client/src'
    destinationDirectory = file('build/tmp_tool/client/classes')
    options.failOnError = false
}

compileTool {
    classpath = sourceSets.main.compileClasspath
}

task jarTools(type: Jar, dependsOn: compileTool) {
    delete 'build/libs/im-trans-tools.jar'
    archiveBaseName = 'im-trans-tools'
    from compileTool.destinationDirectory
}


publishing {
    repositories {
        maven {
            url "http://43.199.160.152:8081/repository/maven-snapshots/"
            allowInsecureProtocol = true
            credentials {
                username 'admin'
                password 'im-liangbo@123'
            }
        }
    }
    publications {
        trans_tools(MavenPublication) {
            groupId = 'com.alanpoi.im'
            artifactId = 'im-trans-tools'
            version = '0.0.1-SNAPSHOT'

            //from components.java

            artifact jarTools
        }
    }
}